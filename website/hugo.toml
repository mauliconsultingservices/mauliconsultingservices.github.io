# Org GitHub Pages: https://github.com/mauliconsultingservices/mauliconsultingservices.github.io
baseURL = 'https://mauliconsultingservices.github.io/'
title = 'Mauli Consulting Services'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[languages.en]
  locale = 'en-us'
  weight = 1

[sitemap]
  changefreq = 'monthly'
  priority = 1.0

[params]
  cssVersion = '5'
  description = 'Principal-level hands-on software engineering — distributed systems, full-stack, agentic AI (LangChain, LangGraph, RAG, MCP), Shopify, cloud-native. B2B retainers, remote from India.'
  tagline = 'Principal IC · distributed systems & full-stack'
  contactFormEndpoint = ''
  # Business inquiry mailto (contact@ when Cloudflare Email Routing is live)
  contactMailbox = 'mb.mauliconsultingservices@gmail.com'

  [params.seo]
    titleHome = 'Mauli Consulting Services — Principal Software Engineering'
    # Optional absolute URL after you add static/img/og.png (1200×630)
    ogImage = ''
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
